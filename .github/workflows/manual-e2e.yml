name: Manual E2E

on:
  workflow_dispatch:

jobs:
  real-fix-and-deploy:
    runs-on: ubuntu-latest
    env:
      XQODER_E2E_PROVIDER: dashscope
      XQODER_E2E_MODEL: qwen-plus
      XQODER_REAL_LLM_E2E: '1'
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run real LLM fix E2E
        run: pnpm test:e2e:real

      - name: Run real deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          TEMP_HOME="$(mktemp -d)"
          TEMP_PROJECT="$(mktemp -d)"
          cp -R packages/cli/src/commands/__fixtures__/fix/syntax-error/. "$TEMP_PROJECT"
          HOME="$TEMP_HOME" pnpm --filter @xqoder/cli exec node dist/index.js config init --provider dashscope --model qwen-plus --api-key "$DASHSCOPE_API_KEY"
          HOME="$TEMP_HOME" pnpm --filter @xqoder/cli exec node dist/index.js fix --dir "$TEMP_PROJECT" --model qwen-plus --max-attempts 2
          (cd "$TEMP_PROJECT" && npm run build)
          pnpm --filter @xqoder/cli exec node dist/index.js deploy --dir "$TEMP_PROJECT" --token "$VERCEL_TOKEN"
