name: Manual E2E

on:
  workflow_dispatch:

jobs:
  real-fix-and-deploy:
    runs-on: ubuntu-latest
    env:
      XQODER_E2E_PROVIDER: dashscope
      XQODER_E2E_MODEL: qwen-plus
      XQODER_REAL_LLM_E2E: '1'
      XQODER_REAL_DEPLOY_E2E: '0'
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build

      - name: Run manual E2E runner
        run: node scripts/run-manual-e2e.mjs
