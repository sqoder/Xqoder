name: CI

on:
  push:
  pull_request:

jobs:
  tracked-secret-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tracked-files secret hygiene
        run: bun run security:tracked

  verify:
    runs-on: ubuntu-latest
    needs:
      - tracked-secret-hygiene

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release check (build + lint + coverage gate)
        run: bun run release:check

      - name: CLI smoke test
        run: bun dist/index.js --help
