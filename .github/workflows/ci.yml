name: CI

on:
  push:
  pull_request:

jobs:
  tracked-secret-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tracked-files secret hygiene
        run: bun run security:tracked

  verify:
    runs-on: ubuntu-latest
    needs:
      - tracked-secret-hygiene
    env:
      HAS_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY != '' }}
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release check (build + lint + coverage gate)
        run: bun run release:check

      - name: Export acceptance metrics
        run: bun run acceptance:metrics

      - name: Upload acceptance metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-metrics
          path: docs/release/latest-acceptance-metrics.json

      - name: Upload golden task report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golden-task-report
          path: |
            docs/release/latest-golden-task-report.json
            docs/release/latest-golden-task-report.md

      - name: Export live acceptance metrics
        if: ${{ env.HAS_DASHSCOPE_API_KEY == 'true' || env.HAS_OPENAI_API_KEY == 'true' || env.HAS_ANTHROPIC_API_KEY == 'true' || env.HAS_GEMINI_API_KEY == 'true' || env.HAS_OPENROUTER_API_KEY == 'true' }}
        run: bun run acceptance:metrics:live

      - name: Upload live acceptance metrics artifact
        if: ${{ env.HAS_DASHSCOPE_API_KEY == 'true' || env.HAS_OPENAI_API_KEY == 'true' || env.HAS_ANTHROPIC_API_KEY == 'true' || env.HAS_GEMINI_API_KEY == 'true' || env.HAS_OPENROUTER_API_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-metrics
          path: docs/release/latest-live-acceptance-metrics.json

      - name: CLI smoke test
        run: bun dist/index.js --help
