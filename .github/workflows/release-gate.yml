name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Strict Release Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages in order)
        run: |
          pnpm build:shared
          pnpm build:renderer
          pnpm build:daemon
          pnpm build:client
          pnpm build:cli
          pnpm build:install-layout

      - name: Run strict release check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            pnpm release:check:strict
          else
            pnpm release:check:strict:dry-run
          fi
        env:
          CI: 'true'
